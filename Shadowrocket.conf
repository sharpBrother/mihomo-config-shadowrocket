DOMAIN-SUFFIX,4sapi.com,AI
DOMAIN-SUFFIX,openrouter.ai,AI
DOMAIN-SUFFIX,packyapi.com,AI
DOMAIN-SUFFIX,packyapi.ai,AI
DOMAIN,cf.api.fan,AI
